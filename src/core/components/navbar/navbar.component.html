<header class="navbar" [class.scrolled]="isScrolled">
  <div class="navbar-container">
    <!-- Logo -->
    <a routerLink="/" class="navbar-logo" (click)="closeMobileMenu()">
      <span class="logo-text">ITLA</span>
      <span class="logo-subtitle">Talent Solutions</span>
    </a>

    <!-- Desktop Navigation -->
    <nav class="navbar-nav">
      @for (link of navLinks; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{exact: link.path === '/'}"
          class="nav-link">
          {{ link.label }}
        </a>
      }
    </nav>

    <!-- CTA Button -->
    <div class="navbar-actions">
      <a routerLink="/contact" class="btn btn-primary btn-cta">
        Nous contacter
      </a>
    </div>

    <!-- Mobile Menu Toggle -->
    <button
      class="mobile-menu-toggle"
      [class.active]="isMobileMenuOpen"
      (click)="toggleMobileMenu()"
      aria-label="Toggle menu">
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>
  </div>

  <!-- Mobile Navigation -->
  <div class="mobile-nav" [class.open]="isMobileMenuOpen">
    <div class="mobile-nav-content">
      @for (link of navLinks; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{exact: link.path === '/'}"
          class="mobile-nav-link"
          (click)="closeMobileMenu()">
          {{ link.label }}
        </a>
      }
      <a routerLink="/contact" class="btn btn-primary btn-cta-mobile" (click)="closeMobileMenu()">
        Nous contacter
      </a>
    </div>
  </div>
</header>

<!-- Overlay for mobile menu -->
<div class="mobile-overlay" [class.active]="isMobileMenuOpen" (click)="closeMobileMenu()"></div>
